databases:
  - name: tooltracker-db-vercel
    plan: free
    region: frankfurt

services:
  - type: web
    name: tooltracker
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tooltracker-db-vercel
          property: connectionString
      - key: AUTH_SECRET
        value: tooltracker2026
      - key: AUTH_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        value: admin@gmail.com
      - key: SEED_ADMIN_PASSWORD
        value: admin123
      - key: SEED_ADMIN_NAME
        value: System Admin
      - key: SEED_USER_EMAIL
        value: user@gmail.com
      - key: SEED_USER_PASSWORD
        value: user123
      - key: SEED_USER_NAME
        value: Standard User
      - key: NODE_VERSION
        value: "20"
