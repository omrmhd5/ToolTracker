databases:
  - name: tooltracker-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: tooltracker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:migrate:prod && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tooltracker-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
