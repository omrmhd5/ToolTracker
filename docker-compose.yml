services:
  postgres:
    image: postgres:18
    container_name: tooltracker-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tooltracker
      POSTGRES_PASSWORD: tooltracker
      POSTGRES_DB: tooltracker
    volumes:
      - tooltracker_pgdata:/var/lib/postgresql

volumes:
  tooltracker_pgdata:
