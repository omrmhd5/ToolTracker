services:
  postgres:
    image: postgres:18
    container_name: tooltracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tooltracker
      POSTGRES_PASSWORD: tooltracker
      POSTGRES_DB: tooltracker
    volumes:
      - tooltracker_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooltracker -d tooltracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tooltracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tooltracker:tooltracker@postgres:5432/tooltracker
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tooltracker_pgdata:
